[build]
  # Schema changes (user_badges, game live-clock columns) must be applied manually:
  #   DATABASE_URL=... npm run db:push
  # Do NOT auto-push here — `drizzle-kit push --force` can accept destructive changes.
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "vite"
  targetPort = 5173

[functions]
  node_bundler = "esbuild"
  included_files = ["shared/**", "server/**"]

# Redirects (API + SPA fallback) live in public/_redirects — keep them in one place.

# One hourly ESPN sync. The handler skips Mar–Jul and 2–8:59am ET without touching the DB,
# then one DB query decides whether anything is live / kicking off / due a line refresh
# before calling ESPN (server/espn/scheduled.ts). Viewers get fresher live scores via
# read-triggered sync on /api/games.
[functions."sync-espn"]
  schedule = "0 * * * *"
